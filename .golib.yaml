schema_version: 1
tool_version: v2.3.0
tool_checksums_sha256: 639af50cddd7dbcc45561a067dd0f361abbddaf1ba5810c680b4fc5b0ba2c10b

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline-v2.txt

operations:
  - module: .
    gate: local-test
    steps:
      - type: go-test
        packages: [.]
        run: '^TestPreCanceledConcurrentShutdownSharesStartedResult$'
        count: 1
        race: true
        timeout: 2m
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: examples
        timeout: 20m
      - type: go-test
        packages: [./otlp]
        run: 'CollectorInteroperability|ExporterFailureModes'
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: [./...]
        run: '^Example'
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzResourceAttributes$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzConfiguration$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./propagation]
        fuzz: '^FuzzPropagationHeaders$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./propagation]
        fuzz: '^FuzzUntrustedMetadata$'
        budget: 10000x
        timeout: 20m
