schema_version: 1
tool_version: v1.7.2
tool_checksums_sha256: 0f83e24640538fb07d02e5ce6c7e61368d5f17d93ac2c6b9c96f9e75c63a4818

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline-v2.txt

operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: examples
        timeout: 20m
      - type: go-test
        packages: [./otlp]
        run: 'CollectorInteroperability|ExporterFailureModes'
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: [./...]
        run: '^Example'
        timeout: 20m
  - module: .
    gate: fuzz
    steps:
      - type: go-test
        packages: [.]
        fuzz: '^FuzzResourceAttributes$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [.]
        fuzz: '^FuzzConfiguration$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./propagation]
        fuzz: '^FuzzPropagationHeaders$'
        budget: 10000x
        timeout: 20m
      - type: go-test
        packages: [./propagation]
        fuzz: '^FuzzUntrustedMetadata$'
        budget: 10000x
        timeout: 20m
