schema_version: 1
tool_version: v1.4.0
tool_checksums_sha256: ba1b71d41dc9b58d5bfb411bc89ae2d45b6f3f778152714bfd1afeab0bef2f33

manifest:
  modules: modules.json
  packages: packages.json

evidence:
  root: .verification

api:
  baselines:
    - module: .
      mode: apidiff
      path: api/baseline.txt

operations:
  - module: .
    gate: test
    steps:
      - type: make
        makefile: verification/package.mk
        target: examples
        timeout: 20m
      - type: go-test
        packages: [./otlp]
        run: 'CollectorInteroperability|ExporterFailureModes'
        timeout: 20m
  - module: .
    gate: docs
    steps:
      - type: go-test
        packages: [./...]
        run: '^Example'
        timeout: 20m
